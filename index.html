<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shortest Path Navigation</title>
    <style>
        body {
            font-family: Inter, Arial, sans-serif;
            margin: 16px;
            background: #0f172a;
            color: #e2e8f0;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }

        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 3vw, 3rem);
        }

        .panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 18px;
            padding: 22px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.35);
        }

        label {
            display: block;
            margin-top: 16px;
            font-weight: 600;
            color: #cbd5e1;
        }

        textarea,
        input {
            width: 100%;
            margin-top: 8px;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Consolas, monospace;
            font-size: 0.95rem;
            outline: none;
        }

        textarea {
            min-height: 160px;
            resize: vertical;
        }

        .controls {
            display: grid;
            gap: 12px;
        }

        #runButton {
            margin-top: 20px;
            padding: 14px 18px;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 700;
            background: linear-gradient(135deg, #38bdf8, #8b5cf6);
            color: #ffffff;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        #runButton:hover {
            transform: translateY(-1px);
            box-shadow: 0 14px 30px rgba(56, 189, 248, 0.28);
        }

        .output {
            margin-top: 20px;
            padding: 18px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 16px;
            color: #cbd5e1;
            line-height: 1.6;
            min-height: 84px;
            white-space: pre-wrap;
        }

        .graph-container {
            position: relative;
            overflow: hidden;
            border-radius: 22px;
            background: radial-gradient(circle at top left, rgba(56, 189, 248, 0.16), transparent 35%),
                radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.16), transparent 25%),
                #111827;
            border: 1px solid #334155;
            padding: 16px;
        }

        .graph-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .graph-header h2 {
            margin: 0;
            font-size: 1.1rem;
            color: #e2e8f0;
        }

        #graphSvg {
            width: 100%;
            height: 520px;
            border-radius: 18px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.96), #020617);
        }

        .legend {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
            margin-top: 14px;
            color: #cbd5e1;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-dot {
            width: 16px;
            height: 16px;
            border-radius: 999px;
            display: inline-block;
        }

        .legend-edge {
            width: 32px;
            height: 3px;
            border-radius: 999px;
            display: inline-block;
        }

        @media (min-width: 980px) {
            .container {
                grid-template-columns: 360px 1fr;
                align-items: start;
            }

            .panel {
                min-height: 500px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <section class="panel">
            <header>
                <div>
                    <h1>Graph Navigator</h1>
                    <p>Build the graph and find the shortest path visually.</p>
                </div>
            </header>

            <label for="edges">Graph edges (one per line):</label>
            <textarea id="edges">1 2 7
1 3 9
1 6 14
2 3 10
2 4 15
3 4 11
3 6 2
4 5 6
5 6 9</textarea>

            <div class="controls">
                <div>
                    <label for="start">Start node:</label>
                    <input id="start" type="text" value="1" />
                </div>
                <div>
                    <label for="goal">Goal node:</label>
                    <input id="goal" type="text" value="5" />
                </div>
                <button id="runButton">Find shortest path</button>
            </div>

            <div class="output" id="output">Output will appear here.</div>
        </section>

        <section class="graph-container">
            <div class="graph-header">
                <h2>Graph visualization</h2>
                <span>Weighted edges, highlighted shortest path</span>
            </div>
            <svg id="graphSvg" viewBox="0 0 760 520"></svg>
            <div class="legend">
                <div class="legend-item"><span class="legend-dot" style="background: #38bdf8"></span> Nodes</div>
                <div class="legend-item"><span class="legend-edge" style="background: #818cf8"></span> Edges</div>
                <div class="legend-item"><span class="legend-dot" style="background: #22c55e"></span> Path nodes</div>
                <div class="legend-item"><span class="legend-edge" style="background: #22c55e"></span> Shortest path
                </div>
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>

</html>
